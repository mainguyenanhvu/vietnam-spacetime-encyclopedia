name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
    # Dự án chạy GitHub Actions gói miễn phí. Push chỉ đụng tài liệu thì không
    # có gì trong dist/ đổi cả — chạy đủ build + hai cổng Chrome headless cho
    # một lượt sửa PLAN.md là đốt phút không đổi lấy gì. Sửa mã hay dữ liệu vẫn
    # chạy đủ như cũ.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Kiểm toán chủ quyền biển đảo (bắt buộc)
        run: node scripts/audit_sovereignty.mjs
      # Tự phát hiện mọi scripts/validate_*.mjs. Trước đây bước này liệt kê tay
      # từng validator và đã bỏ sót validate_nguon_cam.mjs — cổng chặn nguồn bị
      # bác nằm trong repo mà CI không gọi. Thêm validator mới giờ không cần
      # sửa file này nữa.
      - name: Cổng dữ liệu (chạy toàn bộ scripts/validate_*.mjs)
        run: npm run validate
      - run: npm run build
        env:
          BASE_PATH: /vietnam-spacetime-encyclopedia/
      # Hai cổng dưới đây dựng Chrome headless thật (swiftshader, có WebGL) trên
      # vite dev server tự spawn — không đọc dist/, nên thứ tự với bước build chỉ
      # để `tsc` đỏ sớm trước khi tốn công mở trình duyệt.
      #
      # Runner ubuntu-latest có sẵn Google Chrome ở /usr/bin/google-chrome (đã
      # tra bảng runner-images 2026-08-05: Chrome 150 trên ubuntu-24.04). Nếu ảnh
      # runner bỏ Chrome, script exit 2 kèm thông báo rõ — đặt CHROME_PATH để chỉ
      # đường, ĐỪNG hạ hai bước này xuống continue-on-error.
      - name: Cổng chủ quyền mức hiển thị (13 thời kỳ, Chrome headless)
        run: npm run verify:chuquyen
      - name: Smoke test (CDP, Chrome headless)
        run: npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
