name: Build & Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Kiểm toán chủ quyền biển đảo (bắt buộc)
        run: node scripts/audit_sovereignty.mjs
      # Tự phát hiện mọi scripts/validate_*.mjs. Trước đây bước này liệt kê tay
      # từng validator và đã bỏ sót validate_nguon_cam.mjs — cổng chặn nguồn bị
      # bác nằm trong repo mà CI không gọi. Thêm validator mới giờ không cần
      # sửa file này nữa.
      - name: Cổng dữ liệu (chạy toàn bộ scripts/validate_*.mjs)
        run: npm run validate
      - run: npm run build
        env:
          BASE_PATH: /vietnam-spacetime-encyclopedia/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
